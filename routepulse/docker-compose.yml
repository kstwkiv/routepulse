version: "3.8"

# ─────────────────────────────────────────────────────────────────────────────
# RoutePulse — Live Delivery Intelligence Platform
# ─────────────────────────────────────────────────────────────────────────────

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-routepulse}:${POSTGRES_PASSWORD:-routepulse123}@postgres/${POSTGRES_DB:-routepulse}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nfdstg=}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-routepulse_secret}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "30"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    PYTHONPATH: /opt/airflow/routepulse
    # App env vars
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-routepulse}
    POSTGRES_USER: ${POSTGRES_USER:-routepulse}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routepulse123}
    DUCKDB_PATH: /data/routepulse.duckdb
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - airflow_logs:/opt/airflow/logs
    - duckdb_data:/data
    # Mount project source so DAGs can import modules
    - .:/opt/airflow/routepulse
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - routepulse_net


services:
  # ─────────────────────────────────────────────────────────────────────────
  # Volume permission initialiser — runs once before Airflow starts
  # ─────────────────────────────────────────────────────────────────────────
  data-init:
    image: alpine:3.18
    container_name: routepulse_data_init
    command: sh -c "mkdir -p /data && chmod 777 /data && echo 'Data volume permissions set.'"
    volumes:
      - duckdb_data:/data
    networks:
      - routepulse_net
    restart: "no"

  # ─────────────────────────────────────────────────────────────────────────
  # PostgreSQL — raw orders storage
  # ─────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: routepulse_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-routepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routepulse123}
      POSTGRES_DB: ${POSTGRES_DB:-routepulse}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-routepulse} -d ${POSTGRES_DB:-routepulse}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - routepulse_net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Airflow — one-time initialisation
  # ─────────────────────────────────────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: routepulse_airflow_init
    command: >
      bash -c "
        airflow db upgrade &&
        airflow users create
          --username admin
          --password admin
          --firstname RoutePulse
          --lastname Admin
          --role Admin
          --email admin@routepulse.local || true
      "
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_UPGRADE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
    restart: "no"

  # ─────────────────────────────────────────────────────────────────────────
  # Airflow Webserver — UI on port 8080
  # ─────────────────────────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: routepulse_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Airflow Scheduler — runs DAGs every 5 minutes
  # ─────────────────────────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: routepulse_airflow_scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $(hostname)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Streamlit Dashboard — port 8501
  # ─────────────────────────────────────────────────────────────────────────
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: routepulse_streamlit
    ports:
      - "8501:8501"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-routepulse}
      POSTGRES_USER: ${POSTGRES_USER:-routepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routepulse123}
      DUCKDB_PATH: /data/routepulse.duckdb
    volumes:
      - duckdb_data:/data
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - routepulse_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s


# ─────────────────────────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  airflow_logs:
    driver: local
  duckdb_data:       # Shared between Airflow ETL and Streamlit
    driver: local


# ─────────────────────────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────────────────────────
networks:
  routepulse_net:
    driver: bridge
